plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.0'
    id 'application'
}

group = 'com.macnize.client'
version = '1.0.0'
sourceCompatibility = '11'

repositories {
    mavenCentral()
    maven { url 'https://libraries.minecraft.net' }
    maven { url 'https://maven.minecraftforge.net/' }
}

dependencies {
    // Minecraft & Forge
    implementation 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    
    // JSON & Config
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'commons-io:commons-io:2.11.0'
    
    // Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.14.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    
    // Utilities
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.jetbrains:annotations:23.0.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'com.macnize.client.MacsClient'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.macnize.client.MacsClient'
        attributes 'Implementation-Title': 'MacNize\'s Client'
        attributes 'Implementation-Version': version
        attributes 'Created-By': 'MacNize-dev'
    }
}

shadowJar {
    archiveClassifier = ''
    archiveFileName = "MacNizes-Client-${version}.jar"
    
    manifest {
        attributes 'Main-Class': 'com.macnize.client.MacsClient'
        attributes 'Implementation-Title': 'MacNize\'s Client'
        attributes 'Implementation-Version': version
        attributes 'SplashScreen-Image': 'splash.png'
    }
}

task buildUniversalJar {
    dependsOn shadowJar
    doLast {
        println "✅ JAR Universal criado em: build/libs/MacNizes-Client-${version}.jar"
    }
}

build.finalizedBy shadowJar